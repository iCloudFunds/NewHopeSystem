<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KYNET SIMULATION LESSONS AND SOLUTIONS TO PAST GCE QUESTIONS</title>
<style>
  :root{ --red:#e4002b; --blue:#0032a0; --yellow:#ffd100; --green:#00a651; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Arial Black","Arial Bold",Gadget,Arial,sans-serif;font-weight:900;background:#fff;color:#000;min-height:100vh;}

  header{background:var(--blue);border-bottom:10px solid var(--yellow);padding:14px 10px;text-align:center;}
  header h1{color:#fff;font-size:clamp(15px,2.9vw,38px);line-height:1.18;letter-spacing:1px;text-transform:uppercase;text-shadow:3px 3px 0 #000;}
  header .phone{display:inline-block;margin-top:10px;background:var(--yellow);color:#000;font-size:clamp(18px,3vw,34px);letter-spacing:8px;padding:3px 20px;border:4px solid #000;border-radius:10px;}

  #nav{position:sticky;top:0;z-index:500;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
       background:var(--yellow);border-bottom:6px solid #000;padding:10px;}
  #nav button{font-family:inherit;font-weight:900;text-transform:uppercase;
    font-size:clamp(12px,1.65vw,20px);padding:10px 18px;background:#fff;color:#000;
    border:4px solid #000;border-radius:12px;box-shadow:5px 5px 0 #000;cursor:pointer;transition:transform .08s;}
  #nav button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000;}
  #nav button.active{background:var(--red);color:#fff;}

  main{max-width:1100px;margin:0 auto;padding:20px 14px 70px;}
  .card{background:#fff;border:6px solid #000;border-radius:16px;box-shadow:12px 12px 0 var(--blue);padding:18px;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .badge{background:var(--blue);color:#fff;padding:8px 16px;border:4px solid #000;border-radius:999px;
         font-size:clamp(12px,1.6vw,19px);letter-spacing:1px;white-space:nowrap;}
  .badge.red{background:var(--red);} .badge.green{background:var(--green);} .badge.yel{background:var(--yellow);color:#000;}
  .bar{height:20px;background:#fff;border:4px solid #000;border-radius:999px;overflow:hidden;margin-bottom:18px;}
  .bar > i{display:block;height:100%;background:var(--green);width:0;transition:width .35s ease;}

  .lec-title{display:inline-block;background:var(--red);color:#fff;font-size:clamp(15px,2.1vw,27px);
             text-transform:uppercase;padding:10px 18px;border:5px solid #000;border-radius:12px;
             margin-bottom:12px;box-shadow:6px 6px 0 #000;line-height:1.25;}

  .homebtn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
    font-family:inherit;font-weight:900;text-transform:uppercase;text-align:left;
    font-size:clamp(17px,2.6vw,32px);padding:22px 26px;margin-bottom:20px;
    background:#fff;color:#000;border:6px solid #000;border-radius:18px;
    box-shadow:10px 10px 0 #000;cursor:pointer;transition:transform .08s,background .15s;}
  .homebtn:hover{background:var(--yellow);transform:translate(-3px,-3px);}
  .homebtn:active{transform:translate(6px,6px);box-shadow:4px 4px 0 #000;}

  .bh{font-size:clamp(16px,2.1vw,26px);text-transform:uppercase;background:#000;color:var(--yellow);

  .bp{font-size:clamp(14px,1.85vw,22px);line-height:1.5;margin-bottom:12px;}
  .bul{margin:0 0 14px 0;}
  .bul li{list-style:none;font-size:clamp(14px,1.8vw,21px);line-height:1.45;margin-bottom:8px;
          padding-left:30px;position:relative;}
  .bul li:before{content:"▶";position:absolute;left:4px;color:var(--red);}
  .bformula{background:var(--blue);color:#fff;border:5px solid #000;border-radius:12px;

  .bans{margin-top:10px;background:var(--green);color:#fff;border:4px solid #000;border-radius:9px;

  .bp2{background:#f0e8ff;border:5px solid #000;border-left:16px solid #7a00c8;
       border-radius:12px;padding:14px 18px;margin:16px 0;font-size:clamp(14px,1.8vw,21px);line-height:1.5;}
  .bp2 b.p2h{display:block;background:#7a00c8;color:#fff;padding:5px 12px;border-radius:8px;
             margin-bottom:10px;font-size:.92em;letter-spacing:1px;}

  .fig{margin:16px 0;border:5px solid #000;border-radius:12px;background:#fff;padding:8px;overflow:hidden;}
  .fig svg{display:block;width:100%;height:auto;max-height:320px;margin:0 auto;}
  .fig.small svg{max-height:200px;}
  .fig table{border-collapse:collapse; width:100%; font-size:clamp(12px,1.6vw,18px);}
  .fig th, .fig td{border:2px solid #000; padding:6px 8px; text-align:center;}
  .fig th{background:var(--yellow);}

  .qtext{font-size:clamp(18px,2.4vw,30px);line-height:1.35;margin:4px 0 18px;}
  .opt{display:block;width:100%;text-align:left;font-family:inherit;font-weight:900;
       font-size:clamp(15px,1.95vw,24px);padding:15px 18px;margin-bottom:14px;
       background:#fff;color:#000;border:5px solid #000;border-radius:14px;
       box-shadow:7px 7px 0 #000;cursor:pointer;transition:transform .08s,background .15s;}

  .feedback .head{font-size:clamp(16px,2.2vw,28px);margin-bottom:10px;}

  .btn{font-family:inherit;font-weight:900;text-transform:uppercase;
       font-size:clamp(14px,1.9vw,24px);padding:14px 28px;border:5px solid #000;border-radius:14px;

         font-size:clamp(14px,1.8vw,21px);line-height:1.55;}

                  padding:3px 12px;display:inline-block;margin-bottom:10px;font-size:.85em;}

  .p2sol .step{background:#fff;border:3px solid #000;border-radius:8px;padding:8px 12px;margin-bottom:8px;}

  /* Progress display */
  .progress-grid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .pg-card{flex:1 1 200px;background:#fff;border:4px solid #000;border-radius:12px;padding:12px 16px;box-shadow:5px 5px 0 var(--blue);}
  .pg-card h4{font-size:clamp(13px,1.6vw,18px);text-transform:uppercase;margin-bottom:8px;letter-spacing:1px;}
  .pg-card .pg-num{font-size:clamp(22px,3.5vw,36px);color:var(--blue);line-height:1;}
  .pg-card .pg-sub{font-size:clamp(11px,1.4vw,15px);color:#444;margin-top:4px;}

  /* Answer grid on result page */
  .ag-wrap{background:#fffbe0;border:5px solid #000;border-radius:12px;padding:14px;margin:18px 0;}
  .ag-title{font-size:clamp(14px,1.8vw,20px);margin-bottom:10px;text-transform:uppercase;}
  .ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;}
  .ag-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.4vw,16px);
    border:3px solid #000;border-radius:8px;cursor:pointer;transition:transform .1s;}
  .ag-cell:hover{transform:scale(1.08);}
  .ag-cell.correct{background:var(--green);color:#fff;}
  .ag-cell.wrong{background:var(--red);color:#fff;}
  .ag-cell.unanswered{background:#ddd;color:#333;}

  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;}
  .floater{position:absolute;bottom:-14vh;animation:floatUp linear forwards;will-change:transform,opacity;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.4) rotate(0);opacity:0;}
    12%{opacity:1;transform:translateY(-10vh) scale(1) rotate(-8deg);}
    100%{transform:translateY(-120vh) scale(1.15) rotate(28deg);opacity:0;}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
    40%{transform:translateX(11px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shake{animation:shake .5s;}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .pop{animation:pop .4s ease-out;}
</style>

<script>
/* ============================================================
   FIGURE BUILDERS
   ============================================================ */
function panel(inner, label, xoff, ylab, xlab){
  return '<g transform="translate('+xoff+',0)">'+
    '<line x1="20" y1="130" x2="126" y2="130" stroke="#000" stroke-width="4"/>'+
    '<line x1="20" y1="130" x2="20" y2="16" stroke="#000" stroke-width="4"/>'+
    '<text x="0" y="14" font-size="17" font-weight="bold" fill="#000">'+ylab+'</text>'+
    '<text x="130" y="148" font-size="17" font-weight="bold" fill="#000">'+xlab+'</text>'+
    inner+
    '<text x="66" y="172" font-size="18" font-weight="bold" fill="#000">'+label+'</text>'+
  '</g>';
}
function arrowHead(x,y,ang,size,color){
  const a1=ang+Math.PI-0.42, a2=ang+Math.PI+0.42;
  return '<path d="M'+x+','+y+' L'+(x+size*Math.cos(a1))+','+(y+size*Math.sin(a1))+
         ' L'+(x+size*Math.cos(a2))+','+(y+size*Math.sin(a2))+' Z" fill="'+(color||'#000')+'"/>';
}

function makeGraphSVG(data, xLabel, yLabel, xMax, yMax, xStep, yStep) {
  const width = 180, height = 220;
  const left = 30, right = 170, top = 20, bottom = 200;
  const graphWidth = right - left;
  const graphHeight = bottom - top;
  const scaleX = (x) => left + (x / xMax) * graphWidth;
  const scaleY = (y) => bottom - (y / yMax) * graphHeight;
  let gridLines = '';
  for (let x = 0; x <= width; x += 2) {
    gridLines += `<line x1="${x}" y1="0" x2="${x}" y2="${height}" stroke="#b0e0b0" stroke-width="0.4"/>`;
  }
  for (let y = 0; y <= height; y += 2) {
    gridLines += `<line x1="0" y1="${y}" x2="${width}" y2="${y}" stroke="#b0e0b0" stroke-width="0.4"/>`;
  }
  for (let x = 0; x <= width; x += 10) {
    gridLines += `<line x1="${x}" y1="0" x2="${x}" y2="${height}" stroke="#60b060" stroke-width="0.8"/>`;
  }
  for (let y = 0; y <= height; y += 10) {
    gridLines += `<line x1="0" y1="${y}" x2="${width}" y2="${y}" stroke="#60b060" stroke-width="0.8"/>`;
  }
  let axes = '';
  axes += `<line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#000" stroke-width="2"/>`;
  axes += `<line x1="${left}" y1="${top}" x2="${left}" y2="${bottom}" stroke="#000" stroke-width="2"/>`;
  axes += `<polygon points="${right},${bottom} ${right-8},${bottom-4} ${right-8},${bottom+4}" fill="#000"/>`;
  axes += `<polygon points="${left},${top} ${left-4},${top+8} ${left+4},${top+8}" fill="#000"/>`;
  let labels = '';
  for (let x = 0; x <= xMax; x += xStep) {
    const px = scaleX(x);
    labels += `<line x1="${px}" y1="${bottom}" x2="${px}" y2="${bottom+4}" stroke="#000" stroke-width="1"/>`;
    labels += `<text x="${px}" y="${bottom+15}" font-size="8" text-anchor="middle" fill="#000">${x}</text>`;
  }
  for (let y = 0; y <= yMax; y += yStep) {
    const py = scaleY(y);
    labels += `<line x1="${left-4}" y1="${py}" x2="${left}" y2="${py}" stroke="#000" stroke-width="1"/>`;
    labels += `<text x="${left-8}" y="${py+3}" font-size="8" text-anchor="end" fill="#000">${y}</text>`;
  }
  labels += `<text x="${(left+right)/2}" y="${bottom+25}" font-size="10" text-anchor="middle" fill="#000">${xLabel}</text>`;
  labels += `<text x="${left-15}" y="${(top+bottom)/2}" font-size="10" text-anchor="middle" fill="#000" transform="rotate(-90,${left-15},${(top+bottom)/2})">${yLabel}</text>`;
  let points = '';
  data.forEach(([x, y]) => {
    const px = scaleX(x);
    const py = scaleY(y);
    points += `<circle cx="${px}" cy="${py}" r="2.5" fill="red"/>`;
  });
  const n = data.length;
  let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
  data.forEach(([x, y]) => {
    sumX += x;
    sumY += y;
    sumXY += x * y;
    sumX2 += x * x;
  });
  const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;
  const p1x = scaleX(0), p1y = scaleY(intercept);
  const p2x = scaleX(xMax), p2y = scaleY(slope * xMax + intercept);
  const line = `<line x1="${p1x}" y1="${p1y}" x2="${p2x}" y2="${p2y}" stroke="blue" stroke-width="1.5" stroke-dasharray="4,2"/>`;
  return `<svg viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg" style="background:#fff; width:100%; max-width:400px; display:block; margin:0 auto;">${gridLines}${axes}${labels}${line}${points}</svg>`;
}

const GRAPH_Q8A = makeGraphSVG([[0,0],[1,14],[2,30],[3,45],[4,61],[5,75]], "a (m/s²)", "F (N)", 5, 80, 1, 20);
const GRAPH_Q8D = makeGraphSVG([[2,12],[4,23],[6,30],[8,46],[10,58],[12,70]], "l (m)", "R (Ω)", 12, 80, 2, 20);

const FIG25 = '<svg viewBox="0 0 660 150" xmlns="http://www.w3.org/2000/svg">'+

const FIG33 = '<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg">'+
 '<g stroke="#000" stroke-width="6" fill="none" stroke-linecap="round">'+
   '<line x1="60" y1="100" x2="185" y2="100"/>'+

function sinePts(x0,y0,w,amp,cycles,n){
  let out=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    out.push((x0+t*w).toFixed(1)+','+(y0-amp*Math.sin(t*cycles*2*Math.PI)).toFixed(1));
  }
  return out.join(' ');
}

  {type:'p', text:'A concave lens ALWAYS produces a VIRTUAL, UPRIGHT and DIMINISHED image.'},

  {type:'p', text:'Light travels in STRAIGHT lines — this is why a SHADOW forms.'},

  {type:'p2', title:'PAPER 2 SKILL — RAY DIAGRAMS', body:'Use a ruler, draw at least TWO rays, and label the principal focus F.'}

const P2 = [
{sec:"SECTION 1",q:"<b>1.</b> (a) Define <i>force</i>. (2 marks)<br>(b) Friction and weight are two examples of forces.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) State one situation in daily life in which frictional force acts on an object. (1 mark)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) State a difference between these forces. (2 marks)",sol:`<p><b>(a)</b> A force is a push or pull that can change the state of motion or shape of an object.</p><p><b>(b)(i)</b> Walking on the ground, writing with a pen, braking a car.</p><p><b>(b)(ii)</b> Friction acts parallel to the surface and opposes motion; weight acts vertically downwards.</p>`},
{sec:"SECTION 1",q:"<b>2.</b> (a) A glass rod is charged by rubbing with a piece of cloth.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) State the type of charge acquired by the glass rod. (1 mark)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Explain the origin of the charge acquired by the rod. (2 marks)<br>(b) You are provided with an uncharged metal sphere, A, and a positively charged rod, B.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Using sketch diagrams outline the steps you would follow to charge the sphere. (4 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name the method of charging used. (1 mark)",fig:FIG_P2_Q2,sol:`<p><b>(a)(i)</b> Positive charge.</p><p><b>(a)(ii)</b> Rubbing transfers electrons from glass to cloth. Glass loses electrons → positive.</p><p><b>(b)(i)</b> (1) Bring rod B near sphere A. (2) Electrons attracted toward B. (3) Ground the far side. (4) Remove earth connection, then remove rod.</p><p><b>(b)(ii)</b> Charging by INDUCTION.</p>`},
{sec:"SECTION 1",q:"<b>3.</b> (a) Define <i>critical angle</i>. (2 marks)<br>(b) (i) State the conditions necessary for total internal reflection to occur. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name one application of total internal reflection. (1 mark)",sol:`<p><b>(a)</b> Critical angle: angle of incidence in denser medium for which angle of refraction in less dense medium is 90°.</p><p><b>(b)(i)</b> 1. Light travelling denser→less dense. 2. Angle of incidence > critical angle.</p><p><b>(b)(ii)</b> Optical fibres, periscopes.</p>`},
{sec:"SECTION 1",q:"<b>4.</b> A student places her mouth at one end of a U-shaped tube containing water of density 1000 kg m⁻³. She sucks and causes a displacement as shown in figure 2.<br>(a) (i) Using a letter on the diagram, state where she places her mouth. (1 mark)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Explain why the displacement occurs. (2 marks)<br>(b) Determine the pressure difference caused by the sucking. (3 marks)",fig:FIG_P2_Q4,sol:`<p><b>(a)(i)</b> A</p><p><b>(a)(ii)</b> Sucking reduces air pressure at A. Atmospheric pressure at D pushes liquid up.</p><p><b>(b)</b> ΔP = ρgh = 1000 × 10 × 0.03 = 300 Pa.</p>`},
{sec:"SECTION 1",q:"<b>5.</b> (a) Figure 3 shows a network of resistors connected to a 12 V power source.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Identify the meters M₁ and M₂. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) State a property of each meter which makes it suitable. (2 marks)<br>(b) Determine:<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) The combined resistance in the circuit. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) The current in the circuit. (3 marks)",fig:FIG_P2_Q5,sol:`<p><b>(a)(i)</b> M₁ = voltmeter, M₂ = ammeter.</p><p><b>(a)(ii)</b> Voltmeter: very high resistance. Ammeter: very low resistance.</p><p><b>(b)(i)</b> R_p = 10 Ω; total R = 15 Ω.</p><p><b>(b)(ii)</b> I = 12/15 = 0.8 A.</p>`},
{sec:"SECTION 1",q:"<b>6.</b> (a) State the basic law of magnetism. (2 marks)<br>(b) Name one material which may be attracted by a magnet and one which may not. (2 marks)<br>(c) Draw a diagram to show the magnetic flux pattern between two unlike poles. (2 marks)",fig:FIG_P2_Q6,sol:`<p><b>(a)</b> Like poles repel; unlike poles attract.</p><p><b>(b)</b> Attracted: Iron/steel/nickel/cobalt. Not: Copper/plastic/wood.</p><p><b>(c)</b> Field lines from N to S, curving smoothly.</p>`},
{sec:"SECTION 2 — Q7(a,b,c)",q:"<b>7.</b> (a) (i) Define <i>thermometric property</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name the two fixed points used on the celsius scale. (2 marks)<br>(b) (i) Define <i>specific heat capacity</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Describe an experiment to measure the specific heat capacity of water... (8 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) Calculate the quantity of heat required to change the temperature of 2.0 kg of a liquid of specific heat capacity 4000 J kg⁻¹ K⁻¹ from 30 °C to 80 °C. (3 marks)<br>(c) Name the three methods by which heat can be transmitted. (3 marks)",sol:`<p><b>(a)(i)</b> Physical property that changes with temperature.</p><p><b>(a)(ii)</b> Ice point, steam point.</p><p><b>(b)(i)</b> Heat energy to raise 1 kg by 1 °C.</p><p><b>(b)(ii)</b> Use calorimeter + water + heater + thermometer; measure VIt; use E = mcΔθ.</p><p><b>(b)(iii)</b> Q = 2.0 × 4000 × 50 = 400,000 J.</p><p><b>(c)</b> Conduction, convection, radiation.</p>`},
{sec:"SECTION 2 — Q7(d,e,f)",q:"<b>OR 7.</b> (d) (i) Define a <i>wave</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name one wave which can travel through vacuum and another which cannot. (2 marks)<br>(e) (i) State two factors which affect the speed of sound in air. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Describe an experiment to measure the speed of sound in air... (8 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) A stationary ship is 220 m from a high cliff. When it sounds its horn, an echo is heard 1.3 seconds later. Calculate the value for the speed of sound in air. (3 marks)<br>(f) Name any three waves which form part of the electromagnetic spectrum. (3 marks)",sol:`<p><b>(d)(i)</b> A disturbance transferring energy without transferring matter.</p><p><b>(d)(ii)</b> Vacuum: Light. Cannot: Sound.</p><p><b>(e)(i)</b> Temperature, humidity, wind.</p><p><b>(e)(ii)</b> Stand measured distance from wall; clap rhythmically; time for 20 claps; v = 2d/t.</p><p><b>(e)(iii)</b> v = 2 × 220 / 1.3 ≈ 338 m/s.</p><p><b>(f)</b> Radio, microwave, infra-red, visible, UV, X-rays, gamma.</p>`},
{sec:"SECTION 2 — Q8(a,b,c)",q:"<b>8.</b> (a) Recorded data — Force F vs acceleration a:<div class=\"fig\"><table><tr><th>F / N</th><td>0</td><td>14</td><td>30</td><td>45</td><td>61</td><td>75</td></tr><tr><th>a / m s⁻²</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></table></div><br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Define <i>acceleration</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Plot a graph of F vs a. (6 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) Determine the slope. (3 marks)<br>(b) Figure 4 shows a uniform metre rule pivoted at 30 cm. (5 N at 0 cm, W at 50 cm)<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Calculate the weight of the rule. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Calculate the reaction R. (3 marks)<br>(c) (i) State Newton's first law. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Give one practical application. (1 mark)",fig:FIG_P2_Q8B,sol:`<p><b>(a)(i)</b> Rate of change of velocity.</p><p><b>(a)(ii)</b> Graph plotted on green graph paper below.</p><div class="fig">${GRAPH_Q8A}</div><p><b>(a)(iii)</b> Slope = 75/5 = 15 N/(m/s²) = 15 kg.</p><p><b>(b)(i)</b> 5×30 = W×20 → W = 7.5 N.</p><p><b>(b)(ii)</b> R = 5 + 7.5 = 12.5 N.</p><p><b>(c)(i)</b> Object stays at rest or constant velocity unless acted on by a resultant force.</p><p><b>(c)(ii)</b> Wearing a seatbelt.</p>`},
{sec:"SECTION 2 — Q8(d,e,f)",q:"<b>OR 8.</b> (d) Recorded data — Resistance R vs length l:<div class=\"fig\"><table><tr><th>l / m</th><td>2</td><td>4</td><td>6</td><td>8</td><td>10</td><td>12</td></tr><tr><th>R / Ω</th><td>12</td><td>23</td><td>30</td><td>46</td><td>58</td><td>70</td></tr></table></div><br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Define <i>resistance</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Plot a graph of R vs l. (6 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) Determine the slope. (3 marks)<br>(e) Figure 5 shows a modern socket.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Name the wires X, Y, Z. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) If mains V = 220 V and R = 100 Ω, calculate the current. (3 marks)<br>(f) (i) State Ohm's law. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Give an example of an Ohmic conductor. (1 mark)",fig:FIG_P2_Q8E,sol:`<p><b>(d)(i)</b> Opposition to flow of electric current.</p><p><b>(d)(ii)</b> Graph plotted on green graph paper below.</p><div class="fig">${GRAPH_Q8D}</div><p><b>(d)(iii)</b> Slope = 58/10 = 5.8 Ω/m.</p><p><b>(e)(i)</b> X = Live, Y = Earth, Z = Neutral.</p><p><b>(e)(ii)</b> I = 220/100 = 2.2 A.</p><p><b>(f)(i)</b> Current is directly proportional to potential difference (at constant temperature).</p><p><b>(f)(ii)</b> Copper wire.</p>`},
{sec:"SECTION 2 — Q9(a,b,c)",q:"<b>9.</b> (a) (i) Define a <i>semiconductor</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Differentiate between:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(α) Intrinsic and extrinsic semiconductors. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(β) P-type and n-type semiconductors. (2 marks)<br>(b) Magnesium-28, <sup>28</sup><sub>12</sub>Mg, half-life 21 days.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Name the particles that constitute the nucleus. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) How many neutrons are in <sup>28</sup><sub>12</sub>Mg? (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) If <sup>28</sup><sub>12</sub>Mg emits two beta particles, write a balanced decay equation. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iv) If 200 radioactive atoms initially, how many left after 42 days? (2 marks)<br>(c) (i) Sketch the tracks of alpha and beta particles in cloud chambers. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name the three properties responsible for the shape of alpha tracks. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) State one use of radioactivity. (1 mark)",sol:`<p><b>(a)(i)</b> Material with conductivity between conductor and insulator.</p><p><b>(a)(ii)(α)</b> Intrinsic = pure element. Extrinsic = doped with impurities.</p><p><b>(a)(ii)(β)</b> P-type = excess holes. N-type = excess electrons.</p><p><b>(b)(i)</b> Protons and neutrons.</p><p><b>(b)(ii)</b> 28 − 12 = 16 neutrons.</p><p><b>(b)(iii)</b> <sup>28</sup><sub>12</sub>Mg → <sup>28</sup><sub>14</sub>Si + 2<sup>0</sup><sub>-1</sub>e.</p><p><b>(b)(iv)</b> 2 half-lives → 200 → 100 → 50 atoms.</p><p><b>(c)(i)</b> Alpha: short, thick, straight. Beta: long, thin, wavy.</p><p><b>(c)(ii)</b> High ionising power, large mass, short range.</p><p><b>(c)(iii)</b> Cancer treatment, carbon dating.</p>`},
{sec:"SECTION 2 — Q9(d,e,f)",q:"<b>OR 9.</b> (d) (i) Define an <i>electromagnet</i>. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) Name a material for the core of an electromagnet and state the property. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) State two ways to increase strength. (2 marks)<br>(e) Transformer: primary 400 turns, secondary 200 turns.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) Name the two types of transformers. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) If primary = 240 V a.c., find secondary voltage. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) Name one cause of energy loss. (1 mark)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iv) State how to minimise the loss. (1 mark)<br>(f) Figure 5 shows a current-carrying conductor AB in a magnetic field.<br>&nbsp;&nbsp;&nbsp;&nbsp;(i) State the law for direction of force. (2 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(ii) State three ways to increase the force. (3 marks)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iii) Direction AB will move. (1 mark)<br>&nbsp;&nbsp;&nbsp;&nbsp;(iv) State one device based on this. (1 mark)",fig:FIG_P2_Q9F,sol:`<p><b>(d)(i)</b> Temporary magnet from current through coil around soft iron core.</p><p><b>(d)(ii)</b> Soft iron — easily magnetised/demagnetised.</p><p><b>(d)(iii)</b> Increase current, increase turns, use iron core.</p><p><b>(e)(i)</b> Step-up and step-down.</p><p><b>(e)(ii)</b> Vs = 240 × (200/400) = 120 V.</p><p><b>(e)(iii)</b> Eddy currents in the core.</p><p><b>(e)(iv)</b> Laminate the core.</p><p><b>(f)(i)</b> Fleming's left-hand rule.</p><p><b>(f)(ii)</b> Increase current, increase field strength, increase length.</p><p><b>(f)(iii)</b> Upwards.</p><p><b>(f)(iv)</b> Electric motor, loudspeaker.</p>`}
];

/* ============================================================
   PROGRESS TRACKING (localStorage)
   ============================================================ */
const STORAGE_KEY = 'kynet_physics_2025_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return {
        p1: { qi: (typeof d.p1?.qi === 'number') ? d.p1.qi : 0, answers: d.p1?.answers || {} },
        p2: { qi: (typeof d.p2?.qi === 'number') ? d.p2.qi : 0, viewed: d.p2?.viewed || {} }
      };
    }
  } catch (e) {}
  return { p1: { qi: 0, answers: {} }, p2: { qi: 0, viewed: {} } };
}

function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}

let progress = loadProgress();

function getP1AnsweredCount() { return Object.keys(progress.p1.answers).length; }
function getP1Score() {
  let s = 0;
  for (let i = 0; i < QS.length; i++) {
    if (progress.p1.answers[i] === QS[i].a) s++;
  }
  return s;
}
function getP2ViewedCount() { return Object.keys(progress.p2.viewed).length; }

function resetP1() {
  progress.p1 = { qi: 0, answers: {} };
  saveProgress();
}
function resetP2() {
  progress.p2 = { qi: 0, viewed: {} };
  saveProgress();
}
function resetAll() {
  progress = { p1: { qi: 0, answers: {} }, p2: { qi: 0, viewed: {} } };
  saveProgress();
}

function celebrate() {
  const emo = ['🎈','🎈','🌹','🎈','🌹','🎉','🌹','🎈','🌹'];
  for (let i = 0; i < 34; i++) {
    const el = document.createElement('span');
    el.className = 'floater';
    el.textContent = emo[Math.floor(Math.random() * emo.length)];
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (30 + Math.random() * 46) + 'px';
    el.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
    el.style.animationDelay = (Math.random() * 0.7) + 's';
    fx.appendChild(el);
    setTimeout(() => el.remove(), 6500);
  }
}

function setNav() {
  nav.querySelectorAll('button').forEach(b => {
    const t = b.dataset.nav;
    const active =
      (t === 'home' && state.screen === 'home') ||
      (t === 'lectures' && (state.screen === 'lectures' || state.screen === 'lecture')) ||
      (t === 'p1intro' && (state.screen === 'p1intro' || state.screen === 'paper1' || state.screen === 'p1result')) ||
      (t === 'p2intro' && (state.screen === 'p2intro' || state.screen === 'paper2' || state.screen === 'p2result'));
    b.classList.toggle('active', active);
  });
}

nav.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  go(b.dataset.nav);
});

function go(screen) {
  state.screen = screen;
  render();

/* ---------- BLOCK RENDERER ---------- */
function blockHTML(b) {
  switch (b.type) {
    case 'h':       return '<div class="bh">' + b.text + '</div>';
    case 'p':       return '<p class="bp">' + b.text + '</p>';
    case 'ul':      return '<ul class="bul">' + b.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    case 'formula': return '<div class="bformula">' + b.text + '</div>';
    case 'tip':     return '<div class="btip">' + b.text + '</div>';
    case 'fig':     return '<div class="fig ' + (b.cls || '') + '">' + b.html + '</div>';
    case 'worked':  return '<div class="bworked"><b>' + b.title + '</b><ol>' + b.steps.map(s => '<li>' + s + '</li>').join('') + '</ol><div class="bans">' + b.answer + '</div></div>';
    case 'p2':      return '<div class="bp2"><b class="p2h">' + b.title + '</b>' + b.body + '</div>';
  }
  return '';
}

/* ---------- PAPER 1 — QUESTION ---------- */
function renderPaper1() {
  const qi = progress.p1.qi;
  const q = QS[qi];
  const total = QS.length;
  const answered = progress.p1.answers[qi] !== undefined;
  const selected = progress.p1.answers[qi];
  const score = getP1Score();
  const ansCount = getP1AnsweredCount();
  const pct = Math.round(((qi + 1) / total) * 100);

  let html = '';
  html += '<div class="card pop">';
  html += '<div class="qmeta">';
  html += '<span class="badge">QUESTION ' + (qi + 1) + ' OF ' + total + '</span>';
  html += '<span class="badge green" id="scoreBadge">SCORE: ' + score + ' &nbsp;|&nbsp; ANSWERED: ' + ansCount + '/' + total + '</span>';
  html += '</div>';
  html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  html += '<p class="qtext">' + q.q + '</p>';
  if (q.fig) html += '<div class="fig ' + (q.figCls || '') + '">' + q.fig + '</div>';
  html += '<div id="opts">';
  q.o.forEach((o, i) => {
    html += '<button class="opt" data-i="' + i + '"><span class="letter">' + "ABCD"[i] + '</span>' + o + '</button>';
  });
  html += '</div>';
  html += '<div id="fb"></div>';
  html += '<div class="btnrow" style="margin-top:28px; justify-content:space-between;">';
  if (qi > 0) {
    html += '<button class="btn" id="prevBtn">◀ PREVIOUS</button>';
  } else {
    html += '<span></span>';
  }
  if (qi < total - 1) {
    html += '<button class="btn blue" id="nextBtn">NEXT ▶</button>';
  } else {
    html += '<button class="btn green" id="finishBtn">FINISH & SEE RESULT ▶</button>';
  }
  html += '</div>';
  html += '</div>';

  app.innerHTML = html;

  // Wire options + restore answered state
  app.querySelectorAll('.opt').forEach(b => {
    const i = parseInt(b.dataset.i, 10);
    if (answered) {
      b.disabled = true;
      if (i === selected) {
        b.classList.add(i === q.a ? 'correct' : 'wrong');
      }
      if (i === q.a && selected !== q.a) {
        b.classList.add('correct');
      }
    }
    b.onclick = () => chooseP1(i);
  });

  if (answered) {
    showP1Feedback(selected === q.a, q);
  }

  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.onclick = () => {
    progress.p1.qi--;
    saveProgress();
    renderPaper1();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.onclick = () => {
    progress.p1.qi++;
    saveProgress();
    renderPaper1();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const finishBtn = document.getElementById('finishBtn');
  if (finishBtn) finishBtn.onclick = () => {
    state.screen = 'p1result'; render();
  };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function chooseP1(i) {
  const qi = progress.p1.qi;
  if (progress.p1.answers[qi] !== undefined) return;
  const q = QS[qi];
  const opts = app.querySelectorAll('.opt');
  opts.forEach(b => b.disabled = true);
  progress.p1.answers[qi] = i;
  saveProgress();
  opts[q.a].classList.add('correct');
  const score = getP1Score();
  const ansCount = getP1AnsweredCount();
  document.getElementById('scoreBadge').textContent = 'SCORE: ' + score + ' | ANSWERED: ' + ansCount + '/' + QS.length;
  if (i === q.a) {
    celebrate();
    showP1Feedback(true, q);
  } else {
    opts[i].classList.add('wrong');
    const c = app.querySelector('.card');
    c.classList.add('shake');
    setTimeout(() => c.classList.remove('shake'), 600);
    showP1Feedback(false, q);
  }
}

function showP1Feedback(ok, q) {
  const fb = document.getElementById('fb');
  fb.innerHTML =
    '<div class="feedback ' + (ok ? 'good' : 'bad') + ' pop">' +
      '<span class="big">' + (ok ? '🎉 🎈 🌹' : '😢 ❌') + '</span>' +
      '<div class="head">' + (ok ? 'CORRECT! CONGRATULATIONS!' : 'OOPS! THAT IS NOT CORRECT.') + '</div>' +
      '<div style="margin-bottom:12px;">THE RIGHT ANSWER IS <span class="answer-chip">' + "ABCD"[q.a] + '. ' + q.o[q.a] + '</span></div>' +
      '<div><b>EXPLANATION:</b> ' + q.e + '</div>' +
    '</div>';
}

/* ---------- PAPER 1 — RESULT ---------- */
function renderP1Result() {
  const total = QS.length;
  const answered = getP1AnsweredCount();
  const score = getP1Score();
  const unanswered = total - answered;
  const pct = Math.round((score / total) * 100);
  let msg, emoji, cls;
  if (pct >= 80) { msg = 'EXCELLENT! YOU ARE GCE READY!'; emoji = '🏆🎉🌹'; cls = 'good'; }
  else if (pct >= 50) { msg = 'GOOD EFFORT! REVISE THE LECTURES AND TRY AGAIN.'; emoji = '👍🎈'; cls = 'good'; }
  else { msg = 'KEEP PRACTISING! GO THROUGH THE LECTURES AGAIN.'; emoji = '💪📚'; cls = 'bad'; }

  let gridHTML = '<div class="ag">';
  for (let i = 0; i < QS.length; i++) {
    const sel = progress.p1.answers[i];
    let cls2 = 'unanswered';
    if (sel !== undefined) cls2 = (sel === QS[i].a) ? 'correct' : 'wrong';
    gridHTML += '<div class="ag-cell ' + cls2 + '" data-q="' + i + '">' + (i + 1) + '</div>';
  }
  gridHTML += '</div>';

  app.innerHTML =
    '<div class="card pop">' +
      '<div class="qmeta"><span class="badge">PHYSICS 0580/1 — JUNE 2025</span>' +
      '<span class="badge red">RESULT</span></div>' +
      '<div class="feedback ' + cls + '" style="text-align:center;">' +
        '<span class="big">' + emoji + '</span>' +
        '<div class="head">YOU SCORED ' + score + ' OUT OF ' + total + '</div>' +
        '<div style="font-size:clamp(30px,6vw,70px);">' + pct + '%</div>' +
        '<div style="margin-top:10px;">' + msg + '</div>' +
        '<div style="margin-top:14px;font-size:.85em;">ANSWERED: ' + answered + ' &nbsp;•&nbsp; UNANSWERED: ' + unanswered + '</div>' +
      '</div>' +
      (unanswered > 0
        ? '<div class="info red" style="margin-top:18px;border-left-color:#e4002b;background:#ffe1e5;"><b>⚠️ YOU HAVE ' + unanswered + ' UNANSWERED QUESTIONS</b><br>Click the grid below to jump to any question and answer it. Then come back here for a new result.</div>'
        : '') +
      '<div class="ag-wrap">' +
        '<div class="ag-title">📋 ANSWER GRID — CLICK ANY QUESTION TO REVIEW</div>' +
        gridHTML +
        '<div style="margin-top:10px;font-size:.8em;">🟩 CORRECT &nbsp; 🔴 WRONG &nbsp; ⬜ UNANSWERED</div>' +
      '</div>' +
      '<div class="btnrow">' +
        '<button class="btn blue" id="reviewBtn">📝 REVIEW ANSWERS</button>' +
        '<button class="btn green" id="p2Btn">GO TO PAPER 2 ▶</button>' +
        '<button class="btn red" id="resetP1R">🗑️ RESET PAPER 1</button>' +
      '</div>' +
    '</div>';

  if (pct >= 50) celebrate();

  document.querySelectorAll('.ag-cell').forEach(c => {
    c.onclick = () => {
      progress.p1.qi = parseInt(c.dataset.q, 10);
      saveProgress();
      state.screen = 'paper1'; render();
    };
  });
  document.getElementById('reviewBtn').onclick = () => {
    progress.p1.qi = 0;
    saveProgress();
    state.screen = 'paper1'; render();
  };
  document.getElementById('p2Btn').onclick = () => go('p2intro');
  document.getElementById('resetP1R').onclick = () => {
    if (confirm('Reset Paper 1 progress? This cannot be undone.')) {
      resetP1();
      go('p1intro');
    }
  };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- PAPER 2 INTRO ---------- */
function renderP2Intro() {
  const p2viewed = getP2ViewedCount();
  const p2resume = p2viewed > 0 || progress.p2.qi > 0;

  app.innerHTML =
    '<div class="card pop">' +
      '<div class="qmeta"><span class="badge">PAPER 2 — 0580/2</span>' +
      '<span class="badge red">JUNE 2025</span></div>' +
      '<h2 class="lec-title">STRUCTURED QUESTIONS — ' + (p2resume ? 'RESUME' : 'BEGIN') + '</h2>' +
      (p2resume
        ? '<div class="info green"><b>✅ PROGRESS FOUND</b><br>You are currently at <b>Question ' + (progress.p2.qi + 1) + '</b> with <b>' + p2viewed + ' of ' + P2.length + '</b> model answers viewed. Click RESUME to continue.</div>'
        : '') +
      '<div class="info red" style="border-left-color:#e4002b; background:#ffe1e5;"><b>⚠️ ADVISORY</b><br>Please have the original question paper with you for reference, especially for tables and diagrams.</div>' +
      '<div class="info">' +
        '<b>EXAMINATION CONSTANTS</b><br>' +
        'g = 10 m s⁻² &nbsp;|&nbsp; c = 3 × 10⁸ m s⁻¹ &nbsp;|&nbsp; e = 1.6 × 10⁻¹⁹ C<br>' +
        'Duration: 2 hours 30 minutes. Section I in 1 hour, Section II in 1½ hours.' +
      '</div>' +
      '<div class="btnrow">' +
        '<button class="btn green" id="startP2">' + (p2resume ? 'RESUME PAPER 2 ▶' : 'START PAPER 2 ▶') + '</button>' +
        (p2resume ? '<button class="btn red" id="resetP2Btn">🗑️ RESET PAPER 2</button>' : '') +
        '<button class="btn" id="backLec3">📚 LECTURES</button>' +
      '</div>' +
    '</div>';

  document.getElementById('startP2').onclick = () => {
    state.screen = 'paper2'; render();
  };
  document.getElementById('backLec3').onclick = () => { state.screen = 'lectures'; render(); };
  const rb = document.getElementById('resetP2Btn');
  if (rb) rb.onclick = () => {
    if (confirm('Reset Paper 2 progress? This cannot be undone.')) {
      resetP2();
      renderP2Intro();
    }
  };
}

/* ---------- PAPER 2 — QUESTION ---------- */
function renderPaper2() {
  const pi = progress.p2.qi;
  const p = P2[pi];
  const total = P2.length;
  const pct = Math.round(((pi + 1) / total) * 100);
  const viewed = progress.p2.viewed[pi] === true;
  const last = pi === total - 1;
  const viewedCount = getP2ViewedCount();

  let html = '';
  html += '<div class="card pop">';
  html += '<div class="qmeta">';
  html += '<span class="badge">' + p.sec + '</span>';
  html += '<span class="badge yel">QUESTION ' + (pi + 1) + ' OF ' + total + ' &nbsp;|&nbsp; VIEWED: ' + viewedCount + '/' + total + '</span>';
  html += '</div>';
  html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  html += '<div class="p2card" style="box-shadow:none; border-width:4px; margin-bottom:0;">';
  html += '<div class="p2q" style="font-size:clamp(16px,2vw,24px);">' + p.q + '</div>';
  if (p.fig) html += '<div class="fig">' + p.fig + '</div>';
  html += '<button class="btn sm ' + (viewed ? 'green' : 'blue') + '" id="showSolBtn">' + (viewed ? 'HIDE MODEL ANSWER ▲' : 'SHOW MODEL ANSWER ▶') + '</button>';
  html += '<div class="p2sol" id="solBox" style="display:' + (viewed ? 'block' : 'none') + ';">';
  html += '<div class="p2label">MODEL ANSWER</div>' + p.sol;
  html += '</div>';
  html += '</div>';
  html += '<div class="btnrow" style="margin-top:28px; justify-content:space-between;">';
  if (pi > 0) {
    html += '<button class="btn" id="prevP2Btn">◀ PREVIOUS</button>';
  } else {
    html += '<span></span>';
  }
  if (!last) {
    html += '<button class="btn blue" id="nextP2Btn">NEXT ▶</button>';
  } else {
    html += '<button class="btn green" id="finishP2Btn">FINISH & SEE RESULT ▶</button>';
  }
  html += '</div>';
  html += '</div>';

  app.innerHTML = html;

  document.getElementById('showSolBtn').onclick = () => {
    const box = document.getElementById('solBox');
    const btn = document.getElementById('showSolBtn');
    const open = box.style.display === 'block';
    box.style.display = open ? 'none' : 'block';
    btn.textContent = open ? 'SHOW MODEL ANSWER ▶' : 'HIDE MODEL ANSWER ▲';
    btn.className = 'btn sm ' + (open ? 'blue' : 'green');
    if (!open) {
      progress.p2.viewed[pi] = true;
      saveProgress();
      celebrate();
      document.querySelector('.badge.yel').innerHTML = 'QUESTION ' + (pi + 1) + ' OF ' + total + ' &nbsp;|&nbsp; VIEWED: ' + getP2ViewedCount() + '/' + total;
    }
  };

  const prevBtn = document.getElementById('prevP2Btn');
  if (prevBtn) prevBtn.onclick = () => {
    progress.p2.qi--;
    saveProgress();
    renderPaper2();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const nextBtn = document.getElementById('nextP2Btn');
  if (nextBtn) nextBtn.onclick = () => {
    progress.p2.qi++;
    saveProgress();
    renderPaper2();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const finishBtn = document.getElementById('finishP2Btn');
  if (finishBtn) finishBtn.onclick = () => {
    state.screen = 'p2result'; render();
  };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- PAPER 2 — RESULT ---------- */
function renderP2Result() {
  const total = P2.length;
  const viewed = getP2ViewedCount();
  const unviewed = total - viewed;

  let gridHTML = '<div class="ag">';
  for (let i = 0; i < P2.length; i++) {
    const v = progress.p2.viewed[i] === true;
    gridHTML += '<div class="ag-cell ' + (v ? 'correct' : 'unanswered') + '" data-q="' + i + '">' + (i + 1) + '</div>';
  }
  gridHTML += '</div>';

  app.innerHTML =
    '<div class="card pop">' +
      '<div class="qmeta"><span class="badge">PHYSICS 0580/2 — JUNE 2025</span>' +
      '<span class="badge red">PAPER 2 COMPLETE</span></div>' +
      '<div class="feedback good" style="text-align:center;">' +
        '<span class="big">📝 🎉</span>' +
        '<div class="head">YOU HAVE COMPLETED PAPER 2</div>' +
        '<div style="margin-top:10px;">Model answers viewed: <b>' + viewed + ' of ' + total + '</b></div>' +
        (unviewed > 0
          ? '<div style="margin-top:10px;color:#e4002b;">⚠️ ' + unviewed + ' solutions not yet viewed — click the grid below to review them.</div>'
          : '<div style="margin-top:10px;">🏆 ALL model answers viewed! Excellent work.</div>') +
      '</div>' +
      '<div class="ag-wrap">' +
        '<div class="ag-title">📋 QUESTION GRID — CLICK ANY QUESTION TO REVIEW</div>' +
        gridHTML +
        '<div style="margin-top:10px;font-size:.8em;">🟩 SOLUTION VIEWED &nbsp; ⬜ NOT YET VIEWED</div>' +
      '</div>' +
      '<div class="btnrow">' +
        '<button class="btn blue" id="reviewP2Btn">📝 REVIEW PAPER 2</button>' +
        '<button class="btn green" id="p1Btn">GO TO PAPER 1 ▶</button>' +
        '<button class="btn red" id="resetP2R">🗑️ RESET PAPER 2</button>' +
      '</div>' +
    '</div>';

  celebrate();

  document.querySelectorAll('.ag-cell').forEach(c => {
    c.onclick = () => {
      progress.p2.qi = parseInt(c.dataset.q, 10);
      saveProgress();
      state.screen = 'paper2'; render();
    };
  });
  document.getElementById('reviewP2Btn').onclick = () => {
    progress.p2.qi = 0;
    saveProgress();
    state.screen = 'paper2'; render();
  };
  document.getElementById('p1Btn').onclick = () => go('p1intro');
  document.getElementById('resetP2R').onclick = () => {
    if (confirm('Reset Paper 2 progress? This cannot be undone.')) {
      resetP2();
      go('p2intro');
    }
  };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- MASTER RENDER ---------- */
function render() {
  setNav();
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'lectures') renderLectureIndex();
  else if (state.screen === 'lecture') renderLecture();
  else if (state.screen === 'p1intro') renderP1Intro();
  else if (state.screen === 'paper1') renderPaper1();
  else if (state.screen === 'p1result') renderP1Result();
  else if (state.screen === 'p2intro') renderP2Intro();
  else if (state.screen === 'paper2') renderPaper2();
  else if (state.screen === 'p2result') renderP2Result();
}

render();
</script>
</body>
</html>
